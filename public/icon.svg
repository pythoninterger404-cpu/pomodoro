<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d24"/>
      <stop offset="100%" stop-color="#1f232b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="40" stroke="#2b3038" stroke-width="6" fill="none"/>
  <!-- Progress arc (~75%) -->
  <circle cx="60" cy="60" r="40" stroke="#d9a441" stroke-width="6" fill="none"
          stroke-dasharray="251.3" stroke-dashoffset="62.8" stroke-linecap="round"
          transform="rotate(-90 60 60)"/>
  <!-- Play triangle -->
  <polygon points="56,42 56,78 78,60" fill="#d9a441"/>
</svg>
